<div class="col-12 mb-4">
    <div class="card shadow-sm border-0 product-card w-100">
        <div class="row g-0 align-items-center">
            
            <!-- Gambar Kiri -->
            <div class="col-md-4 d-flex align-items-center justify-content-center p-3">
                <div class="position-relative w-100" style="height: 220px;">
                    <img src="{{ doc.image }}" 
                         alt="{{ doc.item_name }}" 
                         class="img-fluid h-100 w-100"
                         style="object-fit: contain;">
                </div>
            </div>

            <!-- Deskripsi Kanan -->
            <div class="col-md-8">
                <div class="card-body d-flex flex-column h-100">
                    <h5 class="card-title fw-semibold mb-2">{{ doc.item_name }}</h5>
                    <span class="badge bg-primary mb-3" style="width: fit-content;">{{ doc.category }}</span>

                    <div>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="text-primary mb-0 fw-bold">${{ doc.price }}  {{ doc.balance_type }}</h5>
                            <div class="text-warning small">
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="far fa-star"></i>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <a href="/{{ doc.route }}" class="btn btn-primary btn-sm w-50">
                                <i class="fas fa-eye me-1"></i> View Details
                            </a>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<style>
.product-card {
    transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
}

.product-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.15) !important;
}

.product-card img {
    transition: transform 0.3s ease;
    background: #fff;
}

.product-card:hover img {
    transform: scale(1.02);
}
</style>
